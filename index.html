    <meta charset="UTF-8" />

    <meta property="og:title" content="PoupaMais — Controle de Gastos" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        try {
          const t = localStorage.getItem('poupamais_theme_v1');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen selection:bg-emerald-500 selection:text-white transition-colors duration-200">

    <script type="module" src="/src/main.tsx"></script>
  </body>
